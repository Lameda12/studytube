name: Bug report
description: Something in the app is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18 / Windows 11, Chrome 130
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://studytube-36f.pages.dev/feed?track=linear-algebra
