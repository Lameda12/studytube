name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (logic + catalog/track data integrity)
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Built output must not contain an API key
        run: |
          if grep -rIE "AIza[0-9A-Za-z_-]{30,}" out; then echo "API key pattern found in build output"; exit 1; fi
